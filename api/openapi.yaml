    BlendMode:
      description: |-
        This type is a string enum with the following possible values

        Normal blends:
        - `PASS_THROUGH` (only applicable to objects with children)
        - `NORMAL`

        Darken:
        - `DARKEN`
        - `MULTIPLY`
        - `LINEAR_BURN`
        - `COLOR_BURN`

        Lighten:
        - `LIGHTEN`
        - `SCREEN`
        - `LINEAR_DODGE`
        - `COLOR_DODGE`

        Contrast:
        - `OVERLAY`
        - `SOFT_LIGHT`
        - `HARD_LIGHT`

        Inversion:
        - `DIFFERENCE`
        - `EXCLUSION`

        Component:
        - `HUE`
        - `SATURATION`
        - `COLOR`
        - `LUMINOSITY`
      enum:
        - PASS_THROUGH
        - NORMAL
        - DARKEN
        - MULTIPLY
        - LINEAR_BURN
        - COLOR_BURN
        - LIGHTEN
        - SCREEN
        - LINEAR_DODGE
        - COLOR_DODGE
        - OVERLAY
        - SOFT_LIGHT
        - HARD_LIGHT
        - DIFFERENCE
        - EXCLUSION
        - HUE
        - SATURATION
        - COLOR
        - LUMINOSITY
      type: string
    Rectangle:
      description: A rectangle that expresses a bounding box in absolute coordinates.
      properties:
        x:
          description: X coordinate of top left corner of the rectangle.
          type: number
        y:
          description: Y coordinate of top left corner of the rectangle.
          type: number
        width:
          description: Width of the rectangle.
          type: number
        height:
          description: Height of the rectangle.
          type: number
      required:
        - height
        - width
        - x
        - y
    LayoutConstraint:
      description: Layout constraint relative to containing Frame
      properties:
        vertical:
          description: >-
            Vertical constraint (relative to containing frame) as an enum:


            - `TOP`: Node is laid out relative to top of the containing frame

            - `BOTTOM`: Node is laid out relative to bottom of the containing
            frame

            - `CENTER`: Node is vertically centered relative to containing frame

            - `TOP_BOTTOM`: Both top and bottom of node are constrained relative
            to containing frame (node stretches with frame)

            - `SCALE`: Node scales vertically with containing frame
          enum:
            - TOP
            - BOTTOM
            - CENTER
            - TOP_BOTTOM
            - SCALE
          type: string
        horizontal:
          description: >-
            Horizontal constraint (relative to containing frame) as an enum:


            - `LEFT`: Node is laid out relative to left of the containing frame

            - `RIGHT`: Node is laid out relative to right of the containing
            frame

            - `CENTER`: Node is horizontally centered relative to containing
            frame

            - `LEFT_RIGHT`: Both left and right of node are constrained relative
            to containing frame (node stretches with frame)

            - `SCALE`: Node scales horizontally with containing frame
          enum:
            - LEFT
            - RIGHT
            - CENTER
            - LEFT_RIGHT
            - SCALE
          type: string
      required:
        - horizontal
        - vertical
    Transform:
      description: >-
        A transformation matrix is standard way in computer graphics to
        represent translation and rotation. These are the top two rows of a 3x3
        matrix. The bottom row of the matrix is assumed to be [0, 0, 1]. This is
        known as an affine transform and is enough to represent translation,
        rotation, and skew.


        The identity transform is [[1, 0, 0], [0, 1, 0]].


        A translation matrix will typically look like:


        ```

        [[1, 0, tx],
          [0, 1, ty]]
        ```


        and a rotation matrix will typically look like:


        ```

        [[cos(angle), sin(angle), 0],
          [-sin(angle), cos(angle), 0]]
        ```


        Another way to think about this transform is as three vectors:


        - The x axis (t[0][0], t[1][0])

        - The y axis (t[0][1], t[1][1])

        - The translation offset (t[0][2], t[1][2])


        The most common usage of the Transform matrix is the `relativeTransform
        property`. This particular usage of the matrix has a few additional
        restrictions. The translation offset can take on any value but we do
        enforce that the axis vectors are unit vectors (i.e. have length 1). The
        axes are not required to be at 90° angles to each other.
      items:
        items:
          type: number
        maxItems: 3
        minItems: 3
        type: array
        default: null
      maxItems: 2
      minItems: 2
      type: array
      default: null
    Vector:
      description: A 2d vector.
      example:
        x: 0.8008281904610115
        y: 6.027456183070403
      properties:
        x:
          description: X coordinate of the vector.
          type: number
        y:
          description: Y coordinate of the vector.
          type: number
      required:
        - x
        - y
    HasGeometryTrait_allOf_fillOverrideTable:
      allOf:
        - $ref: "#/components/schemas/PaintOverride"
      example:
        fills:
          - null
          - null
        inheritFillStyleId: inheritFillStyleId
      nullable: true
    Path:
      description: Defines a single path
      example:
        path: path
        windingRule: NONZERO
        overrideID: 4.965218492984954
      properties:
        path:
          description: A series of path commands that encodes how to draw the path.
          type: string
        windingRule:
          description: The winding rule for the path (same as in SVGs). This determines
            whether a given point in space is inside or outside the path.
          enum:
            - NONZERO
            - EVENODD
          type: string
        overrideID:
          description: If there is a per-region fill, this refers to an ID in the
            `fillOverrideTable`.
          type: number
      required:
        - path
        - windingRule
    ExportSetting:
      description: An export setting.
      example:
        suffix: suffix
        format: JPG
        constraint:
          type: SCALE
          value: 9.965781217890562
      properties:
        suffix:
          type: string
        format:
          enum:
            - JPG
            - PNG
            - SVG
            - PDF
          type: string
        constraint:
          $ref: "#/components/schemas/Constraint"
      required:
        - constraint
        - format
        - suffix
    Effect:
      discriminator:
        mapping:
          DROP_SHADOW: "#/components/schemas/DropShadowEffect"
          INNER_SHADOW: "#/components/schemas/InnerShadowEffect"
          LAYER_BLUR: "#/components/schemas/BlurEffect"
          BACKGROUND_BLUR: "#/components/schemas/BlurEffect"
          TEXTURE: "#/components/schemas/TextureEffect"
          NOISE: "#/components/schemas/NoiseEffect"
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/DropShadowEffect"
        - $ref: "#/components/schemas/InnerShadowEffect"
        - $ref: "#/components/schemas/BlurEffect"
        - $ref: "#/components/schemas/TextureEffect"
        - $ref: "#/components/schemas/NoiseEffect"
    EasingType:
      description: >-
        This type is a string enum with the following possible values:


        - `EASE_IN`: Ease in with an animation curve similar to CSS ease-in.

        - `EASE_OUT`: Ease out with an animation curve similar to CSS ease-out.

        - `EASE_IN_AND_OUT`: Ease in and then out with an animation curve
        similar to CSS ease-in-out.

        - `LINEAR`: No easing, similar to CSS linear.

        - `EASE_IN_BACK`: Ease in with an animation curve that moves past the
        initial keyframe's value and then accelerates as it reaches the end.

        - `EASE_OUT_BACK`: Ease out with an animation curve that starts fast,
        then slows and goes past the ending keyframe's value.

        - `EASE_IN_AND_OUT_BACK`: Ease in and then out with an animation curve
        that overshoots the initial keyframe's value, then accelerates quickly
        before it slows and overshoots the ending keyframes value.

        - `CUSTOM_CUBIC_BEZIER`: User-defined cubic bezier curve.

        - `GENTLE`: Gentle animation similar to react-spring.

        - `QUICK`: Quick spring animation, great for toasts and notifications.

        - `BOUNCY`: Bouncy spring, for delightful animations like a heart
        bounce.

        - `SLOW`: Slow spring, useful as a steady, natural way to scale up
        fullscreen content.

        - `CUSTOM_SPRING`: User-defined spring animation.
      enum:
        - EASE_IN
        - EASE_OUT
        - EASE_IN_AND_OUT
        - LINEAR
        - EASE_IN_BACK
        - EASE_OUT_BACK
        - EASE_IN_AND_OUT_BACK
        - CUSTOM_CUBIC_BEZIER
        - GENTLE
        - QUICK
        - BOUNCY
        - SLOW
        - CUSTOM_SPRING
      type: string
    Interaction:
      description: An interaction in the Figma viewer, containing a trigger and one or
        more actions.
      example:
        trigger: ""
        actions:
          - type: BACK
          - type: BACK
      properties:
        trigger:
          allOf:
            - $ref: "#/components/schemas/Trigger"
          description: The user event that initiates the interaction.
          nullable: true
        actions:
          description: The actions that are performed when the trigger is activated.
          items:
            $ref: "#/components/schemas/Action"
          type: array
          default: null
      required:
        - trigger
    HasFramePropertiesTrait:
      properties:
        clipsContent:
          description: Whether or not this node clip content outside of its bounds
          type: boolean
        background:
          deprecated: true
          description: Background of the node. This is deprecated, as backgrounds for
            frames are now in the `fills` field.
          items:
            $ref: "#/components/schemas/Paint"
          type: array
          default: null
        backgroundColor:
          allOf:
            - $ref: "#/components/schemas/RGBA"
          deprecated: true
          description: Background color of the node. This is deprecated, as frames now
            support more than a solid color as a background. Please use the
            `fills` field instead.
        layoutGrids:
          description: An array of layout grids attached to this node (see layout grids
            section for more details). GROUP nodes do not have this attribute
          items:
            $ref: "#/components/schemas/LayoutGrid"
          type: array
          default: null
        overflowDirection:
          default: NONE
          description: Whether a node has primary axis scrolling, horizontal or vertical.
          enum:
            - HORIZONTAL_SCROLLING
            - VERTICAL_SCROLLING
            - HORIZONTAL_AND_VERTICAL_SCROLLING
            - NONE
          type: string
        layoutMode:
          default: NONE
          description: Whether this layer uses auto-layout to position its children.
          enum:
            - NONE
            - HORIZONTAL
            - VERTICAL
            - GRID
          type: string
        primaryAxisSizingMode:
          default: AUTO
          description: Whether the primary axis has a fixed length (determined by the
            user) or an automatic length (determined by the layout engine). This
            property is only applicable for auto-layout frames.
          enum:
            - FIXED
            - AUTO
          type: string
        counterAxisSizingMode:
          default: AUTO
          description: Whether the counter axis has a fixed length (determined by the
            user) or an automatic length (determined by the layout engine). This
            property is only applicable for auto-layout frames.
          enum:
            - FIXED
            - AUTO
          type: string
        primaryAxisAlignItems:
          default: MIN
          description: Determines how the auto-layout frame's children should be aligned
            in the primary axis direction. This property is only applicable for
            auto-layout frames.
          enum:
            - MIN
            - CENTER
            - MAX
            - SPACE_BETWEEN
          type: string
        counterAxisAlignItems:
          default: MIN
          description: Determines how the auto-layout frame's children should be aligned
            in the counter axis direction. This property is only applicable for
            auto-layout frames.
          enum:
            - MIN
            - CENTER
            - MAX
            - BASELINE
          type: string
        paddingLeft:
          default: 0
          description: The padding between the left border of the frame and its children.
            This property is only applicable for auto-layout frames.
          type: number
        paddingRight:
          default: 0
          description: The padding between the right border of the frame and its children.
            This property is only applicable for auto-layout frames.
          type: number
        paddingTop:
          default: 0
          description: The padding between the top border of the frame and its children.
            This property is only applicable for auto-layout frames.
          type: number
        paddingBottom:
          default: 0
          description: The padding between the bottom border of the frame and its
            children. This property is only applicable for auto-layout frames.
          type: number
        itemSpacing:
          default: 0
          description: The distance between children of the frame. Can be negative. This
            property is only applicable for auto-layout frames.
          type: number
        itemReverseZIndex:
          default: false
          description: Determines the canvas stacking order of layers in this frame. When
            true, the first layer will be draw on top. This property is only
            applicable for auto-layout frames.
          type: boolean
        strokesIncludedInLayout:
          default: false
          description: 'Determines whether strokes are included in layout calculations.
            When true, auto-layout frames behave like css "box-sizing:
            border-box". This property is only applicable for auto-layout
            frames.'
          type: boolean
        layoutWrap:
          description: Whether this auto-layout frame has wrapping enabled.
          enum:
            - NO_WRAP
            - WRAP
          type: string
        counterAxisSpacing:
          description: 'The distance between wrapped tracks of an auto-layout frame. This
            property is only applicable for auto-layout frames with `layoutWrap:
            "WRAP"`'
          type: number
        counterAxisAlignContent:
          default: AUTO
          description: 'Determines how the auto-layout frame’s wrapped tracks should be
            aligned in the counter axis direction. This property is only
            applicable for auto-layout frames with `layoutWrap: "WRAP"`.'
          enum:
            - AUTO
            - SPACE_BETWEEN
          type: string
      required:
        - clipsContent
