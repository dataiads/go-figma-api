                paths representing the object fill.
              items:
                $ref: "#/components/schemas/Path"
              type: array
              default: null
            strokeGeometry:
              description: Only specified if parameter `geometry=paths` is used. An array of
                paths representing the object stroke.
              items:
                $ref: "#/components/schemas/Path"
              type: array
              default: null
            strokeCap:
              default: NONE
              description: A string enum describing the end caps of vector paths.
              enum:
                - NONE
                - ROUND
                - SQUARE
                - LINE_ARROW
                - TRIANGLE_ARROW
                - DIAMOND_FILLED
                - CIRCLE_FILLED
                - TRIANGLE_FILLED
                - WASHI_TAPE_1
                - WASHI_TAPE_2
                - WASHI_TAPE_3
                - WASHI_TAPE_4
                - WASHI_TAPE_5
                - WASHI_TAPE_6
              type: string
            strokeMiterAngle:
              default: 28.96
              description: Only valid if `strokeJoin` is "MITER". The corner angle, in
                degrees, below which `strokeJoin` will be set to "BEVEL" to
                avoid super sharp corners. By default this is 28.96 degrees.
              type: number
    HasExportSettingsTrait:
      properties:
        exportSettings:
          description: An array of export settings representing images to export from the
            node.
          items:
            $ref: "#/components/schemas/ExportSetting"
          type: array
          default: null
    HasEffectsTrait:
      properties:
        effects:
          description: An array of effects attached to this node (see effects section for
            more details)
          items:
            $ref: "#/components/schemas/Effect"
          type: array
          default: null
      required:
        - effects
    HasMaskTrait:
      properties:
        isMask:
          default: false
          description: Does this node mask sibling nodes in front of it?
          type: boolean
        maskType:
          description: >-
            If this layer is a mask, this property describes the operation used
            to mask the layer's siblings. The value may be one of the following:


            - ALPHA: the mask node's alpha channel will be used to determine the
            opacity of each pixel in the masked result.

            - VECTOR: if the mask node has visible fill paints, every pixel
            inside the node's fill regions will be fully visible in the masked
            result. If the mask has visible stroke paints, every pixel inside
            the node's stroke regions will be fully visible in the masked
            result.

            - LUMINANCE: the luminance value of each pixel of the mask node will
            be used to determine the opacity of that pixel in the masked result.
          enum:
            - ALPHA
            - VECTOR
            - LUMINANCE
          type: string
        isMaskOutline:
          default: false
          deprecated: true
          description: True if maskType is VECTOR. This field is deprecated; use maskType
            instead.
          type: boolean
    TransitionSourceTrait:
      properties:
        transitionNodeID:
          description: Node ID of node to transition to in prototyping
          type: string
        transitionDuration:
          description: The duration of the prototyping transition on this node (in
            milliseconds). This will override the default transition duration on
            the prototype, for this node.
          type: number
        transitionEasing:
          allOf:
            - $ref: "#/components/schemas/EasingType"
          description: The easing curve used in the prototyping transition on this node.
        interactions:
          items:
            $ref: "#/components/schemas/Interaction"
          type: array
          default: null
