        spread:
          $ref: "#/components/schemas/VariableAlias"
        color:
          $ref: "#/components/schemas/VariableAlias"
        offsetX:
          $ref: "#/components/schemas/VariableAlias"
        offsetY:
          $ref: "#/components/schemas/VariableAlias"
    BaseBlurEffect:
      description: Base properties shared by all blur effects
      properties:
        type:
          description: A string literal representing the effect's type. Always check the
            type before reading other properties.
          enum:
            - LAYER_BLUR
            - BACKGROUND_BLUR
          type: string
        visible:
          description: Whether this blur is active.
          type: boolean
        radius:
          description: Radius of the blur effect
          minimum: 0
          type: number
        boundVariables:
          $ref: "#/components/schemas/BaseBlurEffect_boundVariables"
      required:
        - radius
        - type
        - visible
    BaseNoiseEffect:
      description: A noise effect
      properties:
        type:
          description: The string literal 'NOISE' representing the effect's type. Always
            check the type before reading other properties.
          enum:
            - NOISE
          type: string
        color:
          allOf:
            - $ref: "#/components/schemas/RGBA"
          description: The color of the noise effect
        visible:
          description: Whether the noise effect is visible.
          type: boolean
        blendMode:
          allOf:
            - $ref: "#/components/schemas/BlendMode"
          description: Blend mode of the noise effect
        noiseSize:
          description: The size of the noise effect
          type: number
        density:
          description: The density of the noise effect
          type: number
      required:
        - blendMode
        - color
        - density
        - noiseSize
        - type
        - visible
    UpdateMediaRuntimeAction_oneOf:
      description: >-
        An action that updates the runtime of a media node by playing, pausing,
        toggling play/pause,

        muting, unmuting, or toggling mute/unmute.


        The `destinationId` is the node ID of the media node to update. If
        `destinationId` is `null`, the action will

        update the media node that contains the action.


        The `mediaAction` is the action to perform on the media node.
      properties:
        type:
          enum:
            - UPDATE_MEDIA_RUNTIME
          type: string
        destinationId:
          nullable: true
          type: string
        mediaAction:
          enum:
            - PLAY
            - PAUSE
            - TOGGLE_PLAY_PAUSE
            - MUTE
            - UNMUTE
            - TOGGLE_MUTE_UNMUTE
          type: string
      required:
        - destinationId
        - mediaAction
        - type
    UpdateMediaRuntimeAction_oneOf_1:
      description: >-
        An action that updates the runtime of a media node by skipping forward
        or backward.


        The `destinationId` is the node ID of the media node to update. If
        `destinationId` is `null`, the action will

        update the media node that contains the action.


        The `mediaAction` is the action to perform on the media node.


        The `amountToSkip` is the amount of time to skip in seconds.
      properties:
        type:
          enum:
            - UPDATE_MEDIA_RUNTIME
          type: string
        destinationId:
          nullable: true
          type: string
        mediaAction:
          enum:
            - SKIP_FORWARD
            - SKIP_BACKWARD
          type: string
        amountToSkip:
          type: number
      required:
        - amountToSkip
        - mediaAction
        - type
    UpdateMediaRuntimeAction_oneOf_2:
      description: >-
        An action that updates the runtime of a media node by skipping to a
        specific time.


        The `destinationId` is the node ID of the media node to update. If
        `destinationId` is `null`, the action will

        update the media node that contains the action.


        The `mediaAction` is the action to perform on the media node.


        The `newTimestamp` is the new time to skip to in seconds.
      properties:
        type:
          enum:
            - UPDATE_MEDIA_RUNTIME
          type: string
        destinationId:
          nullable: true
          type: string
        mediaAction:
          enum:
            - SKIP_TO
          type: string
        newTimestamp:
          type: number
      required:
        - mediaAction
        - newTimestamp
        - type
    VariableData:
      description: A value to set a variable to during prototyping.
      properties:
        type:
          $ref: "#/components/schemas/VariableDataType"
        resolvedType:
          $ref: "#/components/schemas/VariableResolvedDataType"
        value:
          $ref: "#/components/schemas/VariableData_value"
    ConditionalBlock:
      description: Either the if or else conditional blocks. The if block contains a
        condition to check. If that condition is met then it will run those list
        of actions, else it will run the actions in the else block.
      properties:
        condition:
          $ref: "#/components/schemas/VariableData"
        actions:
          items:
            $ref: "#/components/schemas/Action"
          type: array
          default: null
      required:
        - actions
    Navigation:
      description: >-
        The method of navigation. The possible values are:

        - `"NAVIGATE"`: Replaces the current screen with the destination, also
        closing all overlays.

        - `"OVERLAY"`: Opens the destination as an overlay on the current
        screen.

        - `"SWAP"`: On an overlay, replaces the current (topmost) overlay with
        the destination. On a top-level frame,
          behaves the same as `"NAVIGATE"` except that no entry is added to the navigation history.
        - `"SCROLL_TO"`: Scrolls to the destination on the current screen.

        - `"CHANGE_TO"`: Changes the closest ancestor instance of source node to
        the specified variant.
      enum:
        - NAVIGATE
        - SWAP
        - OVERLAY
        - SCROLL_TO
        - CHANGE_TO
      type: string
    Transition:
      oneOf:
        - $ref: "#/components/schemas/SimpleTransition"
        - $ref: "#/components/schemas/DirectionalTransition"
    ColorStop_boundVariables:
      description: The variables bound to a particular gradient stop
      properties:
        color:
          $ref: "#/components/schemas/VariableAlias"
    BaseBlurEffect_boundVariables:
      description: The variables bound to a particular field on this blur effect
      properties:
        radius:
          $ref: "#/components/schemas/VariableAlias"
    VariableDataType:
      description: Defines the types of data a VariableData object can hold
      enum:
        - BOOLEAN
        - FLOAT
        - STRING
        - COLOR
        - VARIABLE_ALIAS
        - EXPRESSION
      type: string
    VariableResolvedDataType:
      description: Defines the types of data a VariableData object can eventually equal
      enum:
        - BOOLEAN
        - FLOAT
        - STRING
        - COLOR
      type: string
    VariableData_value:
      oneOf:
        - type: boolean
        - type: number
        - type: string
        - $ref: "#/components/schemas/RGB"
        - $ref: "#/components/schemas/RGBA"
        - $ref: "#/components/schemas/VariableAlias"
        - $ref: "#/components/schemas/Expression"
    SimpleTransition:
      description: Describes an animation used when navigating in a prototype.
      properties:
        type:
          enum:
            - DISSOLVE
            - SMART_ANIMATE
            - SCROLL_ANIMATE
          type: string
        duration:
          description: The duration of the transition in milliseconds.
          type: number
        easing:
          allOf:
            - $ref: "#/components/schemas/Easing"
          description: The easing curve of the transition.
      required:
        - duration
        - easing
        - type
    DirectionalTransition:
      description: Describes an animation used when navigating in a prototype.
      properties:
        type:
          enum:
            - MOVE_IN
            - MOVE_OUT
            - PUSH
            - SLIDE_IN
            - SLIDE_OUT
          type: string
        direction:
          enum:
            - LEFT
            - RIGHT
            - TOP
            - BOTTOM
          type: string
        duration:
          description: The duration of the transition in milliseconds.
          type: number
        easing:
          allOf:
            - $ref: "#/components/schemas/Easing"
          description: The easing curve of the transition.
        matchLayers:
          description: When the transition `type` is `"SMART_ANIMATE"` or when
            `matchLayers` is `true`, then the transition will be performed using
            smart animate, which attempts to match corresponding layers an
            interpolate other properties during the animation.
          type: boolean
      required:
        - direction
        - duration
        - easing
        - type
    RGB:
      description: An RGB color
      properties:
        r:
          description: Red channel value, between 0 and 1.
          maximum: 1
          minimum: 0
          type: number
        g:
          description: Green channel value, between 0 and 1.
          maximum: 1
          minimum: 0
          type: number
        b:
          description: Blue channel value, between 0 and 1.
          maximum: 1
          minimum: 0
          type: number
      required:
        - b
        - g
        - r
    Expression:
      description: Defines the
        [Expression](https://help.figma.com/hc/en-us/articles/15253194385943)
        object, which contains a list of `VariableData` objects strung together
        by operators (`ExpressionFunction`).
      properties:
        expressionFunction:
          $ref: "#/components/schemas/ExpressionFunction"
        expressionArguments:
          items:
            $ref: "#/components/schemas/VariableData"
          type: array
          default: null
      required:
        - expressionArguments
        - expressionFunction
    Easing:
      description: Describes an easing curve.
      properties:
        type:
          allOf:
            - $ref: "#/components/schemas/EasingType"
          description: The type of easing curve.
        easingFunctionCubicBezier:
          $ref: "#/components/schemas/Easing_easingFunctionCubicBezier"
        easingFunctionSpring:
          $ref: "#/components/schemas/Easing_easingFunctionSpring"
      required:
        - type
    ExpressionFunction:
      description: Defines the list of operators available to use in an Expression.
      enum:
        - ADDITION
        - SUBTRACTION
        - MULTIPLICATION
        - DIVISION
        - EQUALS
        - NOT_EQUAL
        - LESS_THAN
        - LESS_THAN_OR_EQUAL
        - GREATER_THAN
        - GREATER_THAN_OR_EQUAL
        - AND
        - OR
        - VAR_MODE_LOOKUP
        - NEGATE
        - NOT
      type: string
    Easing_easingFunctionCubicBezier:
      description: A cubic bezier curve that defines the easing.
      properties:
        x1:
          description: The x component of the first control point.
          type: number
        y1:
          description: The y component of the first control point.
          type: number
        x2:
          description: The x component of the second control point.
          type: number
        y2:
          description: The y component of the second control point.
          type: number
      required:
        - x1
        - x2
        - y1
        - y2
    Easing_easingFunctionSpring:
      description: A spring function that defines the easing.
      properties:
        mass:
          type: number
        stiffness:
          type: number
        damping:
          type: number
      required:
        - damping
        - mass
        - stiffness
