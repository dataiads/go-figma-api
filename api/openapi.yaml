openapi: 3.1.0
info:
  title: Figma API
  version: 0.42.0
servers:
  - url: https://api.figma.com
paths:
  /v1/files/{file_key}/nodes:
    get:
      description: >-
        Returns the nodes referenced to by `ids` as a JSON object. The nodes are
        retrieved from the Figma file referenced to by `file_key`.


        The node ID and file key can be parsed from any Figma node url:
        `https://www.figma.com/file/{file_key}/{title}?node-id={id}`


        The `name`, `lastModified`, `thumbnailUrl`, `editorType`, and `version`
        attributes are all metadata of the specified file.


        The `linkAccess` field describes the file link share permission level.
        There are 5 types of permissions a shared link can have: `"inherit"`,
        `"view"`, `"edit"`, `"org_view"`, and `"org_edit"`. `"inherit"` is the
        default permission applied to files created in a team project, and will
        inherit the project's permissions. `"org_view"` and `"org_edit"`
        restrict the link to org users.


        The `document` attribute contains a Node of type `DOCUMENT`.


        The `components` key contains a mapping from node IDs to component
        metadata. This is to help you determine which components each instance
        comes from.


        By default, no vector data is returned. To return vector data, pass the
        geometry=paths parameter to the endpoint.

        Each node can also inherit properties from applicable styles. The styles
        key contains a mapping from style IDs to style metadata.


        Important: the nodes map may contain values that are `null`. This may be
        due to the node id not existing within the specified file.
      operationId: getFileNodes
      parameters:
        - description: File to export JSON from. This can be a file key or branch key. Use
            `GET /v1/files/:key` with the `branch_data` query param to get the
            branch key.
          explode: false
          in: path
          name: file_key
          required: true
          schema:
            type: string
          style: simple
        - description: A comma separated list of node IDs to retrieve and convert.
          explode: true
          in: query
          name: ids
          required: true
          schema:
            type: string
          style: form
        - description: A specific version ID to get. Omitting this will get the current
            version of the file.
          explode: true
          in: query
          name: version
          required: false
          schema:
            type: string
          style: form
        - description: >-
            Positive integer representing how deep into the node tree to
            traverse. For example, setting this to 1 will return only the
            children directly underneath the desired nodes. Not setting this
            parameter returns all nodes.


            Note: this parameter behaves differently from the same parameter in
            the `GET /v1/files/:key` endpoint. In this endpoint, the depth will
            be counted starting from the desired node rather than the document
            root node.
          explode: true
          in: query
          name: depth
          required: false
          schema:
            type: number
          style: form
        - description: Set to "paths" to export vector data.
          explode: true
          in: query
          name: geometry
          required: false
          schema:
            type: string
          style: form
        - description: A comma separated list of plugin IDs and/or the string "shared".
            Any data present in the document written by those plugins will be
            included in the result in the `pluginData` and `sharedPluginData`
            properties.
          explode: true
          in: query
          name: plugin_data
          required: false
          schema:
            type: string
          style: form
      responses:
        "200":
          $ref: "#/components/responses/GetFileNodesResponse"
        "400":
          $ref: "#/components/responses/BadRequestErrorResponseWithErrMessage"
        "403":
          $ref: "#/components/responses/ForbiddenErrorResponseWithErrMessage"
        "404":
          $ref: "#/components/responses/NotFoundErrorResponseWithErrMessage"
        "429":
          $ref: "#/components/responses/TooManyRequestsErrorResponseWithErrMessage"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponseWithErrMessage"
      security:
        - PersonalAccessToken: []
        - PlanAccessToken: []
        - OAuth2:
            - file_content:read
            - files:read
      summary: Get file JSON for specific nodes
      tags:
        - Files
  /v1/images/{file_key}:
    get:
      description: >
        Renders images from a file.


        If no error occurs, `"images"` will be populated with a map from node
        IDs to URLs of the rendered images, and `"status"` will be omitted. The
        image assets will expire after 30 days. Images up to 32 megapixels can
        be exported. Any images that are larger will be scaled down.


        Important: the image map may contain values that are `null`. This
        indicates that rendering of that specific node has failed. This may be
        due to the node id not existing, or other reasons such has the node
        having no renderable components. It is guaranteed that any node that was
        requested for rendering will be represented in this map whether or not
        the render succeeded.


        To render multiple images from the same file, use the `ids` query
        parameter to specify multiple node ids.


        ```

        GET /v1/images/:key?ids=1:2,1:3,1:4

        ```
      operationId: getImages
      parameters:
        - description: File to export images from. This can be a file key or branch key.
            Use `GET /v1/files/:key` with the `branch_data` query param to get
            the branch key.
          explode: false
          in: path
          name: file_key
          required: true
          schema:
            type: string
          style: simple
        - description: A comma separated list of node IDs to render.
          explode: true
          in: query
          name: ids
          required: true
          schema:
            type: string
          style: form
        - description: A specific version ID to get. Omitting this will get the current
            version of the file.
          explode: true
          in: query
          name: version
          required: false
          schema:
            type: string
          style: form
        - description: A number between 0.01 and 4, the image scaling factor.
          explode: true
          in: query
          name: scale
          required: false
          schema:
            maximum: 4
            minimum: 0.01
            type: number
          style: form
        - description: A string enum for the image output format.
          explode: true
          in: query
          name: format
          required: false
          schema:
            default: png
            enum:
              - jpg
              - png
              - svg
              - pdf
            type: string
          style: form
        - description: >-
            Whether text elements are rendered as outlines (vector paths) or as
            `<text>` elements in SVGs.


            Rendering text elements as outlines guarantees that the text looks
            exactly the same in the SVG as it does in the browser/inside Figma.


            Exporting as `<text>` allows text to be selectable inside SVGs and
            generally makes the SVG easier to read. However, this relies on the
            browser's rendering engine which can vary between browsers and/or
            operating systems. As such, visual accuracy is not guaranteed as the
            result could look different than in Figma.
          explode: true
          in: query
          name: svg_outline_text
          required: false
          schema:
            default: true
            type: boolean
          style: form
        - description: Whether to include id attributes for all SVG elements. Adds the
            layer name to the `id` attribute of an svg element.
          explode: true
          in: query
          name: svg_include_id
          required: false
          schema:
            default: false
            type: boolean
          style: form
        - description: Whether to include node id attributes for all SVG elements. Adds
            the node id to a `data-node-id` attribute of an svg element.
          explode: true
          in: query
          name: svg_include_node_id
          required: false
          schema:
            default: false
            type: boolean
          style: form
        - description: Whether to simplify inside/outside strokes and use stroke attribute
            if possible instead of `<mask>`.
          explode: true
          in: query
          name: svg_simplify_stroke
          required: false
          schema:
            default: true
            type: boolean
          style: form
        - description: Whether content that overlaps the node should be excluded from
            rendering. Passing false (i.e., rendering overlaps) may increase
            processing time, since more of the document must be included in
            rendering.
          explode: true
          in: query
          name: contents_only
          required: false
          schema:
            default: true
            type: boolean
          style: form
        - description: Use the full dimensions of the node regardless of whether or not it
            is cropped or the space around it is empty. Use this to export text
            nodes without cropping.
          explode: true
          in: query
          name: use_absolute_bounds
          required: false
          schema:
            default: false
            type: boolean
          style: form
      responses:
        "200":
          $ref: "#/components/responses/GetImagesResponse"
        "400":
          $ref: "#/components/responses/BadRequestErrorResponseWithErrMessage"
        "403":
          $ref: "#/components/responses/ForbiddenErrorResponseWithErrMessage"
        "404":
          $ref: "#/components/responses/NotFoundErrorResponseWithErrMessage"
        "429":
          $ref: "#/components/responses/TooManyRequestsErrorResponseWithErrMessage"
        "500":
          $ref: "#/components/responses/InternalServerErrorResponseWithErrMessage"
      security:
        - PersonalAccessToken: []
        - PlanAccessToken: []
        - OAuth2:
            - file_content:read
            - files:read
      summary: Render images of file nodes
      tags:
        - Files
components:
  securitySchemes:
    PersonalAccessToken:
      in: header
      name: X-Figma-Token
      type: apiKey
    PlanAccessToken:
      in: header
      name: X-Figma-Token
      type: apiKey
    OAuth2:
      flows:
        authorizationCode:
          authorizationUrl: https://www.figma.com/oauth
          refreshUrl: https://api.figma.com/v1/oauth/refresh
          scopes:
            current_user:read: Read your name, email, and profile image.
            file_comments:read: Read the comments for files.
            file_comments:write: Post and delete comments and comment reactions in files.
            file_content:read: Read the contents of files, such as nodes and the editor type.
            file_dev_resources:read: Read dev resources in files.
            file_dev_resources:write: Write to dev resources in files.
            file_metadata:read: Read metadata of files.
            file_variables:read: "Read variables in Figma file. Note: this is only available
              to members in Enterprise organizations."
            file_variables:write: "Write to variables in Figma file. Note: this is only
              available to members in Enterprise organizations."
            file_versions:read: Read the version history for files you can access.
            files:read: Deprecated. Read files, projects, users, versions, comments,
              components & styles, and webhooks.
            library_analytics:read: Read library analytics data.
            library_assets:read: Read data of individual published components and styles.
            library_content:read: Read published components and styles of files.
            project_metadata:read: Read metadata of projects.
            projects:read: List projects and files in projects.
            folders:read: List folders and files in folders.
            folder_metadata:read: Read metadata of folders.
            team_library_content:read: Read published components and styles of teams.
            webhooks:read: Read metadata of webhooks.
            webhooks:write: Create and manage webhooks.
          tokenUrl: https://api.figma.com/v1/oauth/token
      type: oauth2
    OrgOAuth2:
      flows:
        authorizationCode:
          authorizationUrl: https://www.figma.com/oauth
          refreshUrl: https://api.figma.com/v1/oauth/refresh
          scopes:
            org:activity_log_read: Read activity logs in the organization.
          tokenUrl: https://api.figma.com/v1/oauth/token
      type: oauth2
  responses:
    GetFileNodesResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object_1"
      description: Response from the GET /v1/files/{file_key}/nodes endpoint.
    BadRequestErrorResponseWithErrMessage:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object_46"
      description: Bad request. Parameters are invalid or malformed. Please check the
        input formats. This error can also happen if the requested resources are
        too large to complete the request, which results in a timeout. Please
        reduce the number and size of objects requested.
    ForbiddenErrorResponseWithErrMessage:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object_49"
      description: The request was valid, but the server is refusing action. The user
        might not have the necessary permissions for a resource, or may need an
        account of some sort.
    NotFoundErrorResponseWithErrMessage:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object_51"
      description: The requested file or resource was not found.
    TooManyRequestsErrorResponseWithErrMessage:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object_53"
      description: In some cases API requests may be throttled or rate limited. Please
        wait a while before attempting the request again (typically a minute).
    InternalServerErrorResponseWithErrMessage:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object_56"
      description: An internal server error occurred.
    GetImagesResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object_2"
      description: Response from the GET /v1/images/{file_key} endpoint.
