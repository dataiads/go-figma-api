    DocumentationLink:
      description: Represents a link to documentation for a component or component set.
      example:
        uri: uri
      properties:
        uri:
          description: Should be a valid URI (e.g. https://www.figma.com).
          type: string
      required:
        - uri
    StyleType:
      description: The type of style
      enum:
        - FILL
        - TEXT
        - EFFECT
        - GRID
      type: string
    IsLayerTrait:
      properties:
        id:
          description: A string uniquely identifying this node within the document.
          type: string
        name:
          description: The name given to the node by the user in the tool.
          type: string
        type:
          description: The type of the node
          type: string
        visible:
          default: true
          description: Whether or not the node is visible on the canvas.
          type: boolean
        locked:
          default: false
          description: If true, layer is locked and cannot be edited
          type: boolean
        isFixed:
          default: false
          deprecated: true
          description: Whether the layer is fixed while the parent is scrolling
          type: boolean
        scrollBehavior:
          default: SCROLLS
          description: How layer should be treated when the frame is resized
          enum:
            - SCROLLS
            - FIXED
            - STICKY_SCROLLS
          type: string
        rotation:
          default: 0
          description: The rotation of the node, if not 0.
          type: number
        componentPropertyReferences:
          additionalProperties:
            type: string
          description: A mapping of a layer's property to component property name of
            component properties attached to this node. The component property
            name can be used to look up more information on the corresponding
            component's or component set's componentPropertyDefinitions.
          type: object
        pluginData:
          description: Data written by plugins that is visible only to the plugin that
            wrote it. Requires the `pluginData` to include the ID of the plugin.
        sharedPluginData:
          description: Data written by plugins that is visible to all plugins. Requires
            the `pluginData` parameter to include the string "shared".
        boundVariables:
          $ref: "#/components/schemas/IsLayerTrait_boundVariables"
        explicitVariableModes:
          additionalProperties:
            type: string
          description: A mapping of variable collection ID to mode ID representing the
            explicitly set modes for this node.
          type: object
      required:
        - id
        - name
        - scrollBehavior
        - type
    HasBlendModeAndOpacityTrait:
      properties:
        blendMode:
          allOf:
            - $ref: "#/components/schemas/BlendMode"
          description: How this node blends with nodes behind it in the scene (see blend
            mode section for more details)
        opacity:
          default: 1
          description: Opacity of the node
          maximum: 1
          minimum: 0
          type: number
      required:
        - blendMode
    HasChildrenTrait:
      properties:
        children:
          description: An array of nodes that are direct children of this node
          items:
            $ref: "#/components/schemas/SubcanvasNode"
          type: array
          default: null
      required:
        - children
    HasLayoutTrait:
      properties:
        absoluteBoundingBox:
          allOf:
            - $ref: "#/components/schemas/Rectangle"
          description: Bounding box of the node in absolute space coordinates.
          nullable: true
        absoluteRenderBounds:
          allOf:
            - $ref: "#/components/schemas/Rectangle"
          description: The actual bounds of a node accounting for drop shadows, thick
            strokes, and anything else that may fall outside the node's regular
            bounding box defined in `x`, `y`, `width`, and `height`. The `x` and
            `y` inside this property represent the absolute position of the node
            on the page. This value will be `null` if the node is invisible.
          nullable: true
        preserveRatio:
          default: false
          description: Keep height and width constrained to same ratio.
          type: boolean
        constraints:
          allOf:
            - $ref: "#/components/schemas/LayoutConstraint"
          description: Horizontal and vertical layout constraints for node.
        relativeTransform:
          allOf:
            - $ref: "#/components/schemas/Transform"
          description: The top two rows of a matrix that represents the 2D transform of
            this node relative to its parent. The bottom row of the matrix is
            implicitly always (0, 0, 1). Use to transform coordinates in
            geometry. Only present if `geometry=paths` is passed.
        size:
          allOf:
            - $ref: "#/components/schemas/Vector"
          description: Width and height of element. This is different from the width and
            height of the bounding box in that the absolute bounding box
            represents the element after scaling and rotation. Only present if
            `geometry=paths` is passed.
        layoutAlign:
          description: >-

            Determines if the layer should stretch along the parent's counter
            axis. This property is only provided for direct children of
            auto-layout frames.


            - `INHERIT`

            - `STRETCH`


            In previous versions of auto layout, determined how the layer is
            aligned inside an auto-layout frame. This property is only provided
            for direct children of auto-layout frames.


            - `MIN`

            - `CENTER`

            - `MAX`

            - `STRETCH`


            In horizontal auto-layout frames, "MIN" and "MAX" correspond to
            "TOP" and "BOTTOM". In vertical auto-layout frames, "MIN" and "MAX"
            correspond to "LEFT" and "RIGHT".
          enum:
            - INHERIT
            - STRETCH
            - MIN
            - CENTER
            - MAX
          type: string
        layoutGrow:
          default: 0
          description: This property is applicable only for direct children of auto-layout
            frames, ignored otherwise. Determines whether a layer should stretch
            along the parent's primary axis. A `0` corresponds to a fixed size
            and `1` corresponds to stretch.
          enum:
            - 0
            - 1
          type: number
        layoutPositioning:
          default: AUTO
          description: Determines whether a layer's size and position should be determined
            by auto-layout settings or manually adjustable.
          enum:
            - AUTO
            - ABSOLUTE
          type: string
        minWidth:
          default: 0
          description: The minimum width of the frame. This property is only applicable
            for auto-layout frames or direct children of auto-layout frames.
          type: number
        maxWidth:
          default: 0
          description: The maximum width of the frame. This property is only applicable
            for auto-layout frames or direct children of auto-layout frames.
          type: number
        minHeight:
          default: 0
          description: The minimum height of the frame. This property is only applicable
            for auto-layout frames or direct children of auto-layout frames.
          type: number
        maxHeight:
          default: 0
          description: The maximum height of the frame. This property is only applicable
            for auto-layout frames or direct children of auto-layout frames.
          type: number
        layoutSizingHorizontal:
          description: >-
            The horizontal sizing setting on this auto-layout frame or frame
            child.

            - `FIXED`

            - `HUG`: only valid on auto-layout frames and text nodes

            - `FILL`: only valid on auto-layout frame children
          enum:
            - FIXED
            - HUG
            - FILL
          type: string
        layoutSizingVertical:
          description: >-
            The vertical sizing setting on this auto-layout frame or frame
            child.

            - `FIXED`

            - `HUG`: only valid on auto-layout frames and text nodes

            - `FILL`: only valid on auto-layout frame children
          enum:
            - FIXED
            - HUG
            - FILL
          type: string
        gridRowCount:
          description: 'The number of rows in the grid layout. This property is only
            applicable for auto-layout frames with `layoutMode: "GRID"`.'
          type: number
        gridColumnCount:
          description: 'The number of columns in the grid layout. This property is only
            applicable for auto-layout frames with `layoutMode: "GRID"`.'
          type: number
        gridRowGap:
          default: 0
          description: 'The distance between rows in the grid layout. This property is
            only applicable for auto-layout frames with `layoutMode: "GRID"`.'
          type: number
        gridColumnGap:
          default: 0
          description: 'The distance between columns in the grid layout. This property is
            only applicable for auto-layout frames with `layoutMode: "GRID"`.'
          type: number
        gridColumnsSizing:
          description: 'The string for the CSS grid-template-columns property. This
            property is only applicable for auto-layout frames with `layoutMode:
            "GRID"`.'
          type: string
        gridRowsSizing:
          description: 'The string for the CSS grid-template-rows property. This property
            is only applicable for auto-layout frames with `layoutMode:
            "GRID"`.'
          type: string
        gridChildHorizontalAlign:
          description: "Determines how a GRID frame's child should be aligned in the
            horizontal direction within its grid area. This property is only
            applicable for direct children of frames with `layoutMode:
            \"GRID\"`."
          enum:
            - AUTO
            - MIN
            - CENTER
            - MAX
          type: string
        gridChildVerticalAlign:
          description: "Determines how a GRID frame's child should be aligned in the
            vertical direction within its grid area. This property is only
            applicable for direct children of frames with `layoutMode:
            \"GRID\"`."
          enum:
            - AUTO
            - MIN
            - CENTER
            - MAX
          type: string
        gridRowSpan:
          default: 1
          description: "The number of rows that a GRID frame's child should span. This
            property is only applicable for direct children of frames with
            `layoutMode: \"GRID\"`."
          type: number
        gridColumnSpan:
          default: 1
          description: "The number of columns that a GRID frame's child should span. This
            property is only applicable for direct children of frames with
            `layoutMode: \"GRID\"`."
          type: number
        gridRowAnchorIndex:
          default: 0
          description: "The index of the row that a GRID frame's child should be anchored
            to. This property is only applicable for direct children of frames
            with `layoutMode: \"GRID\"`."
          type: number
        gridColumnAnchorIndex:
          default: 0
          description: "The index of the column that a GRID frame's child should be
            anchored to. This property is only applicable for direct children of
            frames with `layoutMode: \"GRID\"`."
          type: number
      required:
        - absoluteBoundingBox
        - absoluteRenderBounds
    HasGeometryTrait:
      allOf:
        - $ref: "#/components/schemas/MinimalFillsTrait"
        - $ref: "#/components/schemas/MinimalStrokesTrait"
        - properties:
            fillOverrideTable:
              additionalProperties:
                $ref: "#/components/schemas/HasGeometryTrait_allOf_fillOverrideTable"
              description: Map from ID to PaintOverride for looking up fill overrides. To see
                which regions are overridden, you must use the `geometry=paths`
                option. Each path returned may have an `overrideID` which maps
                to this table.
              type: object
            fillGeometry:
