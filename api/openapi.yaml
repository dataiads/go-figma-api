            id: id
          color:
            type: VARIABLE_ALIAS
            id: id
          offsetX:
            type: VARIABLE_ALIAS
            id: id
          offsetY:
            type: VARIABLE_ALIAS
            id: id
    InnerShadowEffect:
      allOf:
        - description: An inner shadow effect
          properties:
            type:
              description: A string literal representing the effect's type. Always check the
                type before reading other properties.
              enum:
                - INNER_SHADOW
              type: string
        - $ref: "#/components/schemas/BaseShadowEffect"
    BlurEffect:
      oneOf:
        - $ref: "#/components/schemas/NormalBlurEffect"
        - $ref: "#/components/schemas/ProgressiveBlurEffect"
    TextureEffect:
      description: A texture effect
      properties:
        type:
          description: The string literal 'TEXTURE' representing the effect's type. Always
            check the type before reading other properties.
          enum:
            - TEXTURE
          type: string
        visible:
          description: Whether the texture effect is visible.
          type: boolean
        noiseSize:
          description: The size of the texture effect
          type: number
        radius:
          description: The radius of the texture effect
          type: number
        clipToShape:
          description: Whether the texture is clipped to the shape
          type: boolean
      required:
        - clipToShape
        - noiseSize
        - radius
        - type
        - visible
    NoiseEffect:
      oneOf:
        - $ref: "#/components/schemas/MonotoneNoiseEffect"
        - $ref: "#/components/schemas/MultitoneNoiseEffect"
        - $ref: "#/components/schemas/DuotoneNoiseEffect"
    Trigger:
      description: >-
        The `"ON_HOVER"` and `"ON_PRESS"` trigger types revert the navigation
        when the trigger is finished (the result is temporary).

        `"MOUSE_ENTER"`, `"MOUSE_LEAVE"`, `"MOUSE_UP"` and `"MOUSE_DOWN"` are
        permanent, one-way navigation.

        The `delay` parameter requires the trigger to be held for a certain
        duration of time before the action occurs.

        Both `timeout` and `delay` values are in milliseconds.

        The `"ON_MEDIA_HIT"` and `"ON_MEDIA_END"` trigger types can only trigger
        from a video.

        They fire when a video reaches a certain time or ends. The `timestamp`
        value is in seconds.
      oneOf:
        - $ref: "#/components/schemas/Trigger_oneOf"
        - $ref: "#/components/schemas/AfterTimeoutTrigger"
        - $ref: "#/components/schemas/Trigger_oneOf_1"
        - $ref: "#/components/schemas/OnKeyDownTrigger"
        - $ref: "#/components/schemas/OnMediaHitTrigger"
        - $ref: "#/components/schemas/Trigger_oneOf_2"
    Action:
      description: An action that is performed when a trigger is activated.
      oneOf:
        - $ref: "#/components/schemas/Action_oneOf"
        - $ref: "#/components/schemas/OpenURLAction"
        - $ref: "#/components/schemas/UpdateMediaRuntimeAction"
        - $ref: "#/components/schemas/SetVariableAction"
        - $ref: "#/components/schemas/SetVariableModeAction"
        - $ref: "#/components/schemas/ConditionalAction"
        - $ref: "#/components/schemas/NodeAction"
    LayoutGrid:
      description: Guides to align and place objects within a frames.
      properties:
        pattern:
          description: |-
            Orientation of the grid as a string enum

            - `COLUMNS`: Vertical grid
            - `ROWS`: Horizontal grid
            - `GRID`: Square grid
          enum:
            - COLUMNS
            - ROWS
            - GRID
          type: string
        sectionSize:
          description: Width of column grid or height of row grid or square grid spacing.
          type: number
        visible:
          description: Is the grid currently visible?
          type: boolean
        color:
          allOf:
            - $ref: "#/components/schemas/RGBA"
          description: Color of the grid
        alignment:
          description: |-
            Positioning of grid as a string enum

            - `MIN`: Grid starts at the left or top of the frame
            - `MAX`: Grid starts at the right or bottom of the frame
            - `STRETCH`: Grid is stretched to fit the frame
            - `CENTER`: Grid is center aligned
          enum:
            - MIN
            - MAX
            - STRETCH
            - CENTER
          type: string
        gutterSize:
          description: Spacing in between columns and rows
          type: number
        offset:
          description: Spacing before the first column or row
          type: number
        count:
          description: Number of columns or rows
          type: number
        boundVariables:
          $ref: "#/components/schemas/LayoutGrid_boundVariables"
      required:
        - alignment
        - color
        - count
        - gutterSize
        - offset
        - pattern
        - sectionSize
        - visible
    StrokeWeights:
      description: Individual stroke weights
      properties:
        top:
          description: The top stroke weight.
          type: number
        right:
          description: The right stroke weight.
          type: number
        bottom:
          description: The bottom stroke weight.
          type: number
        left:
          description: The left stroke weight.
          type: number
      required:
        - bottom
        - left
        - right
        - top
    ComponentPropertyDefinition_defaultValue:
      description: Initial value of this property for instances.
      oneOf:
        - type: boolean
        - type: string
    SolidPaint:
      allOf:
        - description: A solid color
          properties:
            type:
              description: The string literal "SOLID" representing the paint's type. Always
                check the `type` before reading other properties.
              enum:
                - SOLID
              type: string
            color:
              allOf:
                - $ref: "#/components/schemas/RGBA"
              description: Solid color of the paint
            boundVariables:
              $ref: "#/components/schemas/SolidPaint_allOf_boundVariables"
          required:
            - color
            - type
        - $ref: "#/components/schemas/BasePaint"
      example:
        type: SOLID
        color: ""
        boundVariables:
          color:
            type: VARIABLE_ALIAS
            id: id
        visible: true
        opacity: 0.684685269835264
        blendMode: ""
    GradientPaint:
      allOf:
        - description: A gradient
          properties:
            type:
              description: The string literal representing the paint's type. Always check the
                `type` before reading other properties.
              enum:
                - GRADIENT_LINEAR
                - GRADIENT_RADIAL
                - GRADIENT_ANGULAR
                - GRADIENT_DIAMOND
              type: string
            gradientHandlePositions:
              description: This field contains three vectors, each of which are a position in
                normalized object space (normalized object space is if the top
                left corner of the bounding box of the object is (0, 0) and the
                bottom right is (1,1)). The first position corresponds to the
                start of the gradient (value 0 for the purposes of calculating
                gradient stops), the second position is the end of the gradient
                (value 1), and the third handle position determines the width of
                the gradient.
              items:
                $ref: "#/components/schemas/Vector"
              type: array
              default: null
            gradientStops:
              description: Positions of key points along the gradient axis with the colors
                anchored there. Colors along the gradient are interpolated
                smoothly between neighboring gradient stops.
              items:
                $ref: "#/components/schemas/ColorStop"
              type: array
              default: null
          required:
            - gradientHandlePositions
            - gradientStops
            - type
        - $ref: "#/components/schemas/BasePaint"
    ImagePaint:
      allOf:
        - description: An image
          properties:
            type:
              description: The string literal "IMAGE" representing the paint's type. Always
                check the `type` before reading other properties.
              enum:
                - IMAGE
              type: string
            scaleMode:
              description: Image scaling mode.
              enum:
                - FILL
                - FIT
                - TILE
                - STRETCH
              type: string
            imageRef:
              description: A reference to an image embedded in this node. To download the
                image using this reference, use the `GET file images` endpoint
                to retrieve the mapping from image references to image URLs.
              type: string
            imageTransform:
              allOf:
                - $ref: "#/components/schemas/Transform"
              description: Affine transform applied to the image, only present if `scaleMode`
                is `STRETCH`
            scalingFactor:
              description: Amount image is scaled by in tiling, only present if scaleMode is
                `TILE`.
              type: number
            filters:
              allOf:
                - $ref: "#/components/schemas/ImageFilters"
              description: Defines what image filters have been applied to this paint, if any.
                If this property is not defined, no filters have been applied.
            rotation:
              default: 0
              description: Image rotation, in degrees.
              type: number
            gifRef:
              description: A reference to an animated GIF embedded in this node. To download
                the image using this reference, use the `GET file images`
                endpoint to retrieve the mapping from image references to image
                URLs.
              type: string
          required:
            - imageRef
            - scaleMode
            - type
        - $ref: "#/components/schemas/BasePaint"
    PatternPaint:
      allOf:
        - description: A pattern
          properties:
            type:
              description: The string literal "PATTERN" representing the paint's type. Always
                check the `type` before reading other properties.
              enum:
                - PATTERN
              type: string
            sourceNodeId:
              description: The node id of the source node for the pattern
              type: string
            tileType:
              description: The tile type for the pattern
              enum:
                - RECTANGULAR
                - HORIZONTAL_HEXAGONAL
                - VERTICAL_HEXAGONAL
              type: string
            scalingFactor:
              description: The scaling factor for the pattern
              type: number
            spacing:
              allOf:
                - $ref: "#/components/schemas/Vector"
              description: The spacing for the pattern
            horizontalAlignment:
              description: The horizontal alignment for the pattern
              enum:
                - START
                - CENTER
                - END
              type: string
            verticalAlignment:
              description: The vertical alignment for the pattern
              enum:
                - START
                - CENTER
                - END
              type: string
          required:
            - horizontalAlignment
            - scalingFactor
            - sourceNodeId
            - spacing
            - tileType
            - type
            - verticalAlignment
        - $ref: "#/components/schemas/BasePaint"
    TypeStyle_allOf_boundVariables:
      description: The variables bound to a particular field on this style
      properties:
        fontFamily:
          $ref: "#/components/schemas/VariableAlias"
        fontSize:
          $ref: "#/components/schemas/VariableAlias"
        fontStyle:
          $ref: "#/components/schemas/VariableAlias"
        fontWeight:
          $ref: "#/components/schemas/VariableAlias"
        letterSpacing:
          $ref: "#/components/schemas/VariableAlias"
        lineHeight:
          $ref: "#/components/schemas/VariableAlias"
        paragraphSpacing:
          $ref: "#/components/schemas/VariableAlias"
        paragraphIndent:
          $ref: "#/components/schemas/VariableAlias"
    BaseTypeStyle:
      properties:
        fontFamily:
          description: Font family of text (standard name).
          type: string
        fontPostScriptName:
          description: PostScript font name.
          nullable: true
          type: string
        fontStyle:
          description: Describes visual weight or emphasis, such as Bold or Italic.
          type: string
        italic:
          default: false
          description: Whether or not text is italicized.
          type: boolean
        fontWeight:
          description: Numeric font weight.
          type: number
        fontSize:
          description: Font size in px.
          type: number
        textCase:
          description: Text casing applied to the node, default is the original casing.
          enum:
            - ORIGINAL
            - UPPER
            - LOWER
            - TITLE
            - SMALL_CAPS
            - SMALL_CAPS_FORCED
          type: string
        textAlignHorizontal:
          description: Horizontal text alignment as string enum.
          enum:
            - LEFT
            - RIGHT
            - CENTER
            - JUSTIFIED
          type: string
        textAlignVertical:
          description: Vertical text alignment as string enum.
          enum:
            - TOP
            - CENTER
            - BOTTOM
          type: string
        letterSpacing:
          description: Space between characters in px.
          type: number
        fills:
          description: An array of fill paints applied to the characters.
          items:
            $ref: "#/components/schemas/Paint"
          type: array
          default: null
        hyperlink:
          allOf:
            - $ref: "#/components/schemas/Hyperlink"
          description: Link to a URL or frame.
        opentypeFlags:
          additionalProperties:
            type: number
          description: A map of OpenType feature flags to 1 or 0, 1 if it is enabled and 0
            if it is disabled. Note that some flags aren't reflected here. For
            example, SMCP (small caps) is still represented by the `textCase`
            field.
          type: object
        semanticWeight:
          description: Indicates how the font weight was overridden when there is a text
            style override.
          enum:
            - BOLD
            - NORMAL
          type: string
        semanticItalic:
          description: Indicates how the font style was overridden when there is a text
            style override.
          enum:
            - ITALIC
            - NORMAL
          type: string
    TextPathTypeStyle_allOf_boundVariables:
      description: The variables bound to a particular field on this style
      properties:
        fontFamily:
          $ref: "#/components/schemas/VariableAlias"
        fontSize:
          $ref: "#/components/schemas/VariableAlias"
        fontStyle:
          $ref: "#/components/schemas/VariableAlias"
        fontWeight:
          $ref: "#/components/schemas/VariableAlias"
        letterSpacing:
          $ref: "#/components/schemas/VariableAlias"
    MeasurementOffsetInner:
      description: Measurement offset relative to the inside of the start node
      example:
        type: INNER
        relative: 1.284659006116532
      properties:
        type:
          enum:
            - INNER
          type: string
        relative:
          type: number
      required:
        - relative
        - type
    MeasurementOffsetOuter:
      description: Measurement offset relative to the outside of the start node
      properties:
        type:
          enum:
            - OUTER
          type: string
        fixed:
          type: number
      required:
        - fixed
        - type
    BaseShadowEffect:
      description: Base properties shared by all shadow effects
      properties:
        color:
          allOf:
            - $ref: "#/components/schemas/RGBA"
          description: The color of the shadow
        blendMode:
          allOf:
            - $ref: "#/components/schemas/BlendMode"
          description: Blend mode of the shadow
        offset:
          allOf:
            - $ref: "#/components/schemas/Vector"
          description: How far the shadow is projected in the x and y directions
        radius:
          description: Radius of the blur effect (applies to shadows as well)
          minimum: 0
          type: number
        spread:
          default: 0
          description: >-
            The distance by which to expand (or contract) the shadow.


            For drop shadows, a positive `spread` value creates a shadow larger
            than the node, whereas a negative value creates a shadow smaller
            than the node.


            For inner shadows, a positive `spread` value contracts the shadow.
            Spread values are only accepted on rectangles and ellipses, or on
            frames, components, and instances with visible fill paints and
            `clipsContent` enabled. When left unspecified, the default value is
            0.
          type: number
        visible:
          description: Whether this shadow is visible.
          type: boolean
        boundVariables:
          $ref: "#/components/schemas/BaseShadowEffect_boundVariables"
      required:
        - blendMode
        - color
        - offset
        - radius
        - visible
    NormalBlurEffect:
      allOf:
        - description: A normal blur effect
          properties:
            blurType:
              description: The string literal 'NORMAL' representing the blur type. Always
                check the blurType before reading other properties.
              enum:
                - NORMAL
              type: string
        - $ref: "#/components/schemas/BaseBlurEffect"
    ProgressiveBlurEffect:
      allOf:
        - description: A progressive blur effect
          properties:
            blurType:
              description: The string literal 'PROGRESSIVE' representing the blur type. Always
                check the blurType before reading other properties.
              enum:
                - PROGRESSIVE
              type: string
            startRadius:
              description: The starting radius of the progressive blur
              type: number
            startOffset:
              allOf:
                - $ref: "#/components/schemas/Vector"
              description: The starting offset of the progressive blur
            endOffset:
              allOf:
                - $ref: "#/components/schemas/Vector"
              description: The ending offset of the progressive blur
          required:
            - blurType
            - endOffset
            - startOffset
            - startRadius
        - $ref: "#/components/schemas/BaseBlurEffect"
    MonotoneNoiseEffect:
      allOf:
        - description: A monotone noise effect
          properties:
            noiseType:
              description: The string literal 'MONOTONE' representing the noise type.
              enum:
                - MONOTONE
              type: string
          required:
            - noiseType
        - $ref: "#/components/schemas/BaseNoiseEffect"
    MultitoneNoiseEffect:
      allOf:
        - description: A multitone noise effect
          properties:
            noiseType:
              description: The string literal 'MULTITONE' representing the noise type.
              enum:
                - MULTITONE
              type: string
            opacity:
              description: The opacity of the noise effect
              type: number
          required:
            - noiseType
            - opacity
        - $ref: "#/components/schemas/BaseNoiseEffect"
    DuotoneNoiseEffect:
      allOf:
        - description: A duotone noise effect
          properties:
            noiseType:
              description: The string literal 'DUOTONE' representing the noise type.
              enum:
                - DUOTONE
              type: string
            secondaryColor:
              allOf:
                - $ref: "#/components/schemas/RGBA"
              description: The secondary color of the noise effect
          required:
            - noiseType
            - secondaryColor
        - $ref: "#/components/schemas/BaseNoiseEffect"
    Trigger_oneOf:
      properties:
        type:
          enum:
            - ON_CLICK
            - ON_HOVER
